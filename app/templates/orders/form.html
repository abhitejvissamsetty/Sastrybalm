{% extends "base.html" %}

{% block title %}New Order{% endblock %}

{% block content %}
<div class="max-w-4xl space-y-6">

  <div class="flex items-center gap-x-4">
    <a href="/operations/orders" class="text-slate-400 hover:text-white transition-colors">
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
      </svg>
    </a>
    <div>
      <h1 class="text-2xl font-bold text-white">New Order</h1>
      <p class="mt-1 text-sm text-slate-400">Create a sales order</p>
    </div>
  </div>

  {% if error %}
  <div class="rounded-lg bg-red-900/40 border border-red-700 px-4 py-3 text-sm text-red-300">{{ error }}</div>
  {% endif %}

  <form method="post" id="order-form" class="space-y-6">

    <!-- Header -->
    <div class="rounded-xl border border-slate-700 bg-slate-800/50 p-6 space-y-4">
      <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Order Details</h2>
      <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-4">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Outlet <span class="text-red-400">*</span></label>
          <select name="outlet_id" required
                  class="w-full rounded-lg bg-slate-900 border border-slate-700 text-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="">Select outlet…</option>
            {% for o in outlets %}
            <option value="{{ o.id }}">{{ o.name }}{% if o.code %} ({{ o.code }}){% endif %}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Channel Partner (Fulfillment) <span class="text-red-400">*</span></label>
          <select name="channel_partner_id" required
                  class="w-full rounded-lg bg-slate-900 border border-slate-700 text-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="">Select Channel Partner…</option>
            {% for cp in channel_partners %}
            <option value="{{ cp.id }}">{{ cp.name }} ({{ cp.partner_type }})</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Flow Type</label>
          <select name="flow_type"
                  class="w-full rounded-lg bg-slate-900 border border-slate-700 text-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            {% for ft in FlowType %}
            <option value="{{ ft.value }}">{{ ft.value.replace('_',' ').upper() }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Notes</label>
          <input type="text" name="notes"
                 class="w-full rounded-lg bg-slate-900 border border-slate-700 text-white px-3 py-2 text-sm placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                 placeholder="Optional notes">
        </div>
      </div>
    </div>

    <!-- Line Items -->
    <div class="rounded-xl border border-slate-700 bg-slate-800/50 p-6 space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Products</h2>
        <button type="button" id="add-row"
                class="inline-flex items-center gap-x-1.5 rounded-lg bg-slate-700 px-3 py-1.5 text-xs font-medium text-white hover:bg-slate-600 transition-colors">
          <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
          Add Row
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="min-w-full" id="items-table">
          <thead>
            <tr class="text-left text-xs font-semibold text-slate-400 uppercase tracking-wider">
              <th class="pb-2 pr-3">Product</th>
              <th class="pb-2 pr-3 w-20">Qty</th>
              <th class="pb-2 pr-3 w-28">Unit Price (₹)</th>
              <th class="pb-2 pr-3 w-24">GST %</th>
              <th class="pb-2 pr-3 w-24">Disc %</th>
              <th class="pb-2 w-24 text-right">Line Total</th>
              <th class="pb-2 w-8"></th>
            </tr>
          </thead>
          <tbody id="items-body">
            <tr class="item-row">
              <td class="pr-3 pb-3">
                <select name="product_id[]"
                        class="product-select w-full rounded-lg bg-slate-900 border border-slate-700 text-white px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                  <option value="">Select product…</option>
                  {% for p in products %}
                  <option value="{{ p.id }}" data-price="{{ p.mrp or 0 }}" data-gst="{{ p.gst_rate or 0 }}">{{ p.name }}</option>
                  {% endfor %}
                </select>
              </td>
              <td class="pr-3 pb-3">
                <input type="number" name="quantity[]" value="1" min="1"
                       class="qty-input w-full rounded-lg bg-slate-900 border border-slate-700 text-white px-2 py-1.5 text-sm text-right focus:outline-none focus:ring-2 focus:ring-indigo-500">
              </td>
              <td class="pr-3 pb-3">
                <input type="number" name="unit_price[]" step="0.01" min="0" value="0"
                       class="price-input w-full rounded-lg bg-slate-900 border border-slate-700 text-white px-2 py-1.5 text-sm text-right focus:outline-none focus:ring-2 focus:ring-indigo-500">
              </td>
              <td class="pr-3 pb-3">
                <input type="number" name="gst_rate[]" step="0.01" min="0" value="0"
                       class="gst-input w-full rounded-lg bg-slate-900 border border-slate-700 text-white px-2 py-1.5 text-sm text-right focus:outline-none focus:ring-2 focus:ring-indigo-500">
              </td>
              <td class="pr-3 pb-3">
                <input type="number" name="discount_pct[]" step="0.01" min="0" max="100" value="0"
                       class="disc-input w-full rounded-lg bg-slate-900 border border-slate-700 text-white px-2 py-1.5 text-sm text-right focus:outline-none focus:ring-2 focus:ring-indigo-500">
              </td>
              <td class="pb-3 text-right">
                <span class="line-total text-sm font-medium text-white">₹0.00</span>
              </td>
              <td class="pb-3 pl-2">
                <button type="button" class="remove-row text-red-500 hover:text-red-400 transition-colors hidden">
                  <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                  </svg>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="flex justify-end pt-2 border-t border-slate-700">
        <div class="text-right">
          <span class="text-sm text-slate-400">Order Total:</span>
          <span id="grand-total" class="ml-2 text-lg font-bold text-white">₹0.00</span>
        </div>
      </div>
    </div>

    <div class="flex items-center justify-end gap-x-3">
      <a href="/operations/orders" class="rounded-lg px-4 py-2 text-sm font-medium text-slate-400 hover:text-white transition-colors">Cancel</a>
      <button type="submit" name="action" value="draft"
              class="rounded-lg border border-slate-600 px-5 py-2 text-sm font-semibold text-slate-300 hover:bg-slate-700 transition-colors">
        Save as Draft
      </button>
      <button type="submit"
              class="rounded-lg bg-indigo-600 px-5 py-2 text-sm font-semibold text-white hover:bg-indigo-500 transition-colors">
        Create Order
      </button>
    </div>

  </form>
</div>

<template id="row-template">
  <tr class="item-row">
    <td class="pr-3 pb-3">
      <select name="product_id[]"
              class="product-select w-full rounded-lg bg-slate-900 border border-slate-700 text-white px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="">Select product…</option>
        {% for p in products %}
        <option value="{{ p.id }}" data-price="{{ p.mrp or 0 }}" data-gst="{{ p.gst_rate or 0 }}">{{ p.name }}</option>
        {% endfor %}
      </select>
    </td>
    <td class="pr-3 pb-3">
      <input type="number" name="quantity[]" value="1" min="1"
             class="qty-input w-full rounded-lg bg-slate-900 border border-slate-700 text-white px-2 py-1.5 text-sm text-right focus:outline-none focus:ring-2 focus:ring-indigo-500">
    </td>
    <td class="pr-3 pb-3">
      <input type="number" name="unit_price[]" step="0.01" min="0" value="0"
             class="price-input w-full rounded-lg bg-slate-900 border border-slate-700 text-white px-2 py-1.5 text-sm text-right focus:outline-none focus:ring-2 focus:ring-indigo-500">
    </td>
    <td class="pr-3 pb-3">
      <input type="number" name="gst_rate[]" step="0.01" min="0" value="0"
             class="gst-input w-full rounded-lg bg-slate-900 border border-slate-700 text-white px-2 py-1.5 text-sm text-right focus:outline-none focus:ring-2 focus:ring-indigo-500">
    </td>
    <td class="pr-3 pb-3">
      <input type="number" name="discount_pct[]" step="0.01" min="0" max="100" value="0"
             class="disc-input w-full rounded-lg bg-slate-900 border border-slate-700 text-white px-2 py-1.5 text-sm text-right focus:outline-none focus:ring-2 focus:ring-indigo-500">
    </td>
    <td class="pb-3 text-right">
      <span class="line-total text-sm font-medium text-white">₹0.00</span>
    </td>
    <td class="pb-3 pl-2">
      <button type="button" class="remove-row text-red-500 hover:text-red-400 transition-colors">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </td>
  </tr>
</template>

<script>
function calcRow(row) {
  const qty = parseFloat(row.querySelector('.qty-input').value) || 0;
  const price = parseFloat(row.querySelector('.price-input').value) || 0;
  const disc = parseFloat(row.querySelector('.disc-input').value) || 0;
  const gstRate = parseFloat(row.querySelector('.gst-input').value) || 0;
  
  const base = qty * price;
  const total = base - (base * disc / 100);
  const lineTotalExclusive = total / (1 + gstRate / 100);
  const gstAmt = total - lineTotalExclusive;
  
  row.querySelector('.line-total').textContent = '₹' + total.toFixed(2);
  return total;
}

function calcGrand() {
  let total = 0;
  document.querySelectorAll('.item-row').forEach(r => { total += calcRow(r); });
  document.getElementById('grand-total').textContent = '₹' + total.toFixed(2);
}

document.getElementById('items-body').addEventListener('input', calcGrand);

document.getElementById('items-body').addEventListener('change', e => {
  const sel = e.target.closest('.product-select');
  if (!sel) return;
  const opt = sel.options[sel.selectedIndex];
  const row = sel.closest('.item-row');
  row.querySelector('.price-input').value = opt.dataset.price || 0;
  row.querySelector('.gst-input').value = opt.dataset.gst || 0;
  calcGrand();
});

document.getElementById('add-row').addEventListener('click', () => {
  const tmpl = document.getElementById('row-template').content.cloneNode(true);
  document.getElementById('items-body').appendChild(tmpl);
  calcGrand();
});

document.getElementById('items-body').addEventListener('click', e => {
  const btn = e.target.closest('.remove-row');
  if (!btn) return;
  const rows = document.querySelectorAll('.item-row');
  if (rows.length > 1) { btn.closest('.item-row').remove(); calcGrand(); }
});
</script>
{% endblock %}
