{% extends "base.html" %}
{% block title %}Product Mappings{% endblock %}
{% block content %}
<div class="space-y-6">
  <div><h1 class="text-2xl font-bold text-white">Product Mappings</h1><p class="text-sm text-slate-400">{{ profile.name }} · conversion settings</p></div>
  <form method="post" action="/company/profiles/{{ profile.id }}/product-mappings/new" class="grid gap-3 rounded-xl border border-slate-700 bg-slate-800/40 p-5 sm:grid-cols-4">
    <select name="product_id" required class="rounded-lg bg-slate-900 border border-slate-700 text-white px-3 py-2">{% for p in products %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}</select>
    <input name="conversion_factor" type="number" step="0.00001" value="1" class="rounded-lg bg-slate-900 border border-slate-700 text-white px-3 py-2">
    <button class="rounded-lg bg-indigo-600 px-4 py-2 font-semibold text-white">Add</button>
  </form>
  <div class="overflow-hidden rounded-xl border border-slate-700"><table class="min-w-full divide-y divide-slate-700"><thead><tr><th class="px-4 py-3 text-left text-xs text-slate-400">Product</th><th class="px-4 py-3 text-left text-xs text-slate-400">Factor</th></tr></thead><tbody class="divide-y divide-slate-700">{% for m in mappings %}<tr><td class="px-4 py-3 text-white">{{ m.product.name }}</td><td class="px-4 py-3 text-slate-300">{{ m.conversion_factor }}</td></tr>{% else %}<tr><td colspan="2" class="px-4 py-8 text-center text-slate-500">No mappings.</td></tr>{% endfor %}</tbody></table></div>
</div>
{% endblock %}
