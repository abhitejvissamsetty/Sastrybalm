{% extends "base.html" %}
{% block title %}Company Profiles{% endblock %}
{% block content %}
<div class="space-y-6">
  <div class="flex items-center justify-between">
    <div><h1 class="text-2xl font-bold text-white">Company Profiles</h1><p class="text-sm text-slate-400">Company identities for native workflows</p></div>
    <a href="/company/profiles/new" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white">New Profile</a>
  </div>
  <div class="overflow-hidden rounded-xl border border-slate-700">
    <table class="min-w-full divide-y divide-slate-700">
      <thead class="bg-slate-900/50"><tr><th class="px-4 py-3 text-left text-xs text-slate-400">Company</th><th class="px-4 py-3 text-left text-xs text-slate-400">Code</th><th class="px-4 py-3 text-right text-xs text-slate-400">Actions</th></tr></thead>
      <tbody class="divide-y divide-slate-700 bg-slate-800/40">
      {% for item in profiles %}
        <tr><td class="px-4 py-3 text-white">{{ item.name }}</td><td class="px-4 py-3 font-mono text-slate-300">{{ item.code }}</td><td class="px-4 py-3 text-right"><a class="text-indigo-400" href="/company/profiles/{{ item.id }}/edit">Edit</a></td></tr>
      {% else %}<tr><td colspan="4" class="px-4 py-8 text-center text-slate-500">No profiles.</td></tr>{% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
