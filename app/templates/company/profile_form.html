{% extends "base.html" %}
{% block title %}{{ 'Edit' if item else 'New' }} Company Profile{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
  <div>
    <h1 class="text-2xl font-bold text-white">{{ 'Edit' if item else 'New' }} Company Profile</h1>
    <p class="mt-1 text-sm text-slate-400">Company identity used by native workflows.</p>
  </div>
  {% if error %}<div class="rounded-lg border border-red-800 bg-red-950/40 p-4 text-sm text-red-300">{{ error }}</div>{% endif %}
  <form method="post" class="space-y-6 rounded-xl border border-slate-700 bg-slate-800/50 p-6">
    <div class="grid gap-5 sm:grid-cols-2">
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1.5">Code</label>
        <input name="code" required value="{{ item.code if item else '' }}" class="w-full rounded-lg bg-slate-900 border border-slate-700 text-white px-3 py-2">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1.5">Name</label>
        <input name="name" required value="{{ item.name if item else '' }}" class="w-full rounded-lg bg-slate-900 border border-slate-700 text-white px-3 py-2">
      </div>
    </div>
    <div class="flex justify-end gap-3">
      <a href="/company/profiles" class="rounded-lg border border-slate-600 px-4 py-2 text-slate-300">Cancel</a>
      <button class="rounded-lg bg-indigo-600 px-4 py-2 font-semibold text-white">Save Profile</button>
    </div>
  </form>
</div>
{% endblock %}
