{% extends "base.html" %}
{% block title %}Account Mappings{% endblock %}
{% block content %}
<div class="space-y-6">
  <div><h1 class="text-2xl font-bold text-white">Account Mappings</h1><p class="text-sm text-slate-400">{{ profile.name }} · internal account categories</p></div>
  <form method="post" action="/company/profiles/{{ profile.id }}/account-mappings/new" class="grid gap-3 rounded-xl border border-slate-700 bg-slate-800/40 p-5 sm:grid-cols-4">
    <input name="account_name" required placeholder="Account name" class="rounded-lg bg-slate-900 border border-slate-700 text-white px-3 py-2">
    <input name="account_type" placeholder="Type" class="rounded-lg bg-slate-900 border border-slate-700 text-white px-3 py-2">
    <button class="rounded-lg bg-indigo-600 px-4 py-2 font-semibold text-white">Add</button>
  </form>
  <div class="overflow-hidden rounded-xl border border-slate-700"><table class="min-w-full divide-y divide-slate-700"><thead><tr><th class="px-4 py-3 text-left text-xs text-slate-400">Account</th><th class="px-4 py-3 text-left text-xs text-slate-400">Type</th></tr></thead><tbody class="divide-y divide-slate-700">{% for m in mappings %}<tr><td class="px-4 py-3 text-white">{{ m.account_name }}</td><td class="px-4 py-3 text-slate-300">{{ m.account_type or '—' }}</td></tr>{% else %}<tr><td colspan="2" class="px-4 py-8 text-center text-slate-500">No mappings.</td></tr>{% endfor %}</tbody></table></div>
</div>
{% endblock %}
