{% extends "base.html" %}
{% block title %}SMTP Settings{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto px-4 py-8 space-y-6">
  <div>
    <h2 class="text-3xl font-bold text-white">SMTP Server Configuration</h2>
    <p class="mt-1 text-sm text-slate-400">Configure secure email delivery for login OTPs and notifications.</p>
  </div>
  {% if success %}<div class="rounded-lg bg-emerald-900/40 border border-emerald-700 p-4 text-emerald-300">{{ success }}</div>{% endif %}
  {% if error %}<div class="rounded-lg bg-red-900/40 border border-red-700 p-4 text-red-300">{{ error }}</div>{% endif %}
  <form method="post" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-5">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
      <label class="text-sm text-slate-300">SMTP Host
        <input class="mt-1 w-full rounded-lg bg-slate-800 border-slate-700" name="smtp_host" value="{{ smtp.smtp_host }}" required>
      </label>
      <label class="text-sm text-slate-300">Port
        <input class="mt-1 w-full rounded-lg bg-slate-800 border-slate-700" type="number" name="smtp_port" value="{{ smtp.smtp_port }}" required>
      </label>
      <label class="text-sm text-slate-300">Username
        <input class="mt-1 w-full rounded-lg bg-slate-800 border-slate-700" name="smtp_user" value="{{ smtp.smtp_user }}">
      </label>
      <label class="text-sm text-slate-300">Password
        <input class="mt-1 w-full rounded-lg bg-slate-800 border-slate-700" type="password" name="smtp_password" value="{{ smtp.smtp_password }}">
      </label>
      <label class="text-sm text-slate-300">From address
        <input class="mt-1 w-full rounded-lg bg-slate-800 border-slate-700" type="email" name="smtp_from" value="{{ smtp.smtp_from }}" required>
      </label>
      <label class="flex items-center gap-2 text-sm text-slate-300 mt-7">
        <input type="checkbox" name="smtp_use_tls" value="true" {% if smtp.smtp_use_tls %}checked{% endif %}> Use TLS
      </label>
    </div>
    <div class="flex justify-end gap-3">
      <button formaction="/settings/smtp/test" class="rounded-lg bg-cyan-700 px-4 py-2 text-white">Send test email</button>
      <button formaction="/settings/smtp" class="rounded-lg bg-indigo-600 px-4 py-2 text-white">Save SMTP settings</button>
    </div>
  </form>
</div>
{% endblock %}
