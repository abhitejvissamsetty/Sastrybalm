{% extends "base.html" %}

{% block title %}New Asset Capitalization{% endblock %}

{% block content %}
<div class="max-w-3xl space-y-6">

  <div class="flex items-center gap-x-4">
    <a href="/operations/marketing-assets" class="text-slate-400 hover:text-white transition-colors">
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
      </svg>
    </a>
    <div>
      <h1 class="text-2xl font-bold text-white">Deploy Asset</h1>
      <p class="mt-1 text-sm text-slate-400">Record a new asset deployment at an outlet</p>
    </div>
  </div>

  {% if error %}
  <div class="rounded-lg bg-red-900/40 border border-red-700 px-4 py-3 text-sm text-red-300">{{ error }}</div>
  {% endif %}

  <form method="post" enctype="multipart/form-data" class="space-y-6">

    <!-- Outlet Info -->
    <div class="rounded-xl border border-slate-700 bg-slate-800/50 p-6 space-y-5">
      <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Deployment Location</h2>
      
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1.5">Outlet <span class="text-red-400">*</span></label>
        <select name="outlet_id" required
                class="w-full rounded-lg bg-slate-900 border border-slate-700 text-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="">Select outlet…</option>
          {% for o in outlets %}
          <option value="{{ o.id }}">{{ o.name }} ({{ o.code }})</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <!-- Asset Info -->
    <div class="rounded-xl border border-slate-700 bg-slate-800/50 p-6 space-y-5">
      <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Asset Details</h2>

      <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Item Name <span class="text-red-400">*</span></label>
          <input type="text" name="item_name" required
                 class="w-full rounded-lg bg-slate-900 border border-slate-700 text-white px-3 py-2 text-sm placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                 placeholder="e.g. Fridge, Banner">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Item Code</label>
          <input type="text" name="item_code"
                 class="w-full rounded-lg bg-slate-900 border border-slate-700 text-white px-3 py-2 text-sm font-mono placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>

      <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Quantity <span class="text-red-400">*</span></label>
          <input type="number" name="quantity" required min="1" value="1"
                 class="w-full rounded-lg bg-slate-900 border border-slate-700 text-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Warehouse</label>
          <select name="warehouse_name"
                  class="w-full rounded-lg bg-slate-900 border border-slate-700 text-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="">Select Warehouse…</option>
            {% for w in warehouses %}
            <option value="{{ w.name }}">{{ w.name }} ({{ w.code }})</option>
            {% endfor %}
          </select>
        </div>
      </div>
    </div>

    <!-- Execution Info -->
    <div class="rounded-xl border border-slate-700 bg-slate-800/50 p-6 space-y-5">
      <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Execution</h2>

      <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Deployed By <span class="text-red-400">*</span></label>
          <select name="deployed_by" required id="deployed_by"
                  class="w-full rounded-lg bg-slate-900 border border-slate-700 text-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            {% for db in DeployedByType %}
            <option value="{{ db.value }}">{{ db.value.replace('_', ' ').title() }}</option>
            {% endfor %}
          </select>
        </div>
        <div id="vendor-field" class="hidden">
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Vendor Technician</label>
          <select name="vendor_id"
                  class="w-full rounded-lg bg-slate-900 border border-slate-700 text-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="">Select vendor…</option>
            {% for v in vendors %}
            <option value="{{ v.id }}">{{ v.name }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1.5">Asset Photo / Deployment Proof Image</label>
        <input type="file" name="image" accept="image/*"
               class="w-full rounded-lg bg-slate-900 border border-slate-700 text-slate-300 px-3 py-1.5 text-sm file:mr-4 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1.5">Notes</label>
        <textarea name="notes" rows="3"
                  class="w-full rounded-lg bg-slate-900 border border-slate-700 text-white px-3 py-2 text-sm placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  placeholder="Optional comments..."></textarea>
      </div>
    </div>

    <div class="flex items-center justify-end gap-x-3">
      <a href="/operations/marketing-assets" class="rounded-lg px-4 py-2 text-sm font-medium text-slate-400 hover:text-white transition-colors">Cancel</a>
      <button type="submit"
              class="rounded-lg bg-indigo-600 px-5 py-2 text-sm font-semibold text-white hover:bg-indigo-500 transition-colors">
        Deploy Asset
      </button>
    </div>
  </form>
</div>

<script>
  document.getElementById('deployed_by').addEventListener('change', function() {
    const vf = document.getElementById('vendor-field');
    if (this.value === 'vendor_technician') {
      vf.classList.remove('hidden');
    } else {
      vf.classList.add('hidden');
    }
  });
</script>
{% endblock %}
