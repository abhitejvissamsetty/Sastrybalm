<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Sastrybalm SFA</title>
  <script src="/static/vendor/tailwindcss.js"></script>
</head>
<body class="h-full flex items-center justify-center p-4 bg-slate-950 text-slate-100 antialiased font-sans">
  <div class="w-full max-w-md bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-3xl p-8 sm:p-10 text-center shadow-2xl relative overflow-hidden">
    
    <!-- Ambient top glow -->
    <div class="absolute -top-16 left-1/2 -translate-x-1/2 w-48 h-48 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Error Code & Icon -->
    <div class="flex flex-col items-center mb-6">
      <div class="h-16 w-16 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center shadow-[0_0_25px_rgba(99,102,241,0.15)] mb-4">
        <svg class="h-8 w-8 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
        </svg>
      </div>
      <span class="inline-flex items-center gap-x-1.5 px-3 py-1 rounded-full text-xs font-mono font-bold tracking-wider text-indigo-400 bg-indigo-500/10 border border-indigo-500/20 uppercase">
        <span class="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-pulse"></span>
        404 Not Found
      </span>
    </div>

    <!-- Message Title & Explanation -->
    <h2 class="text-2xl sm:text-3xl font-black text-white tracking-tight">Page Not Found</h2>
    <p class="mt-3 text-slate-300 text-sm leading-relaxed max-w-xs mx-auto">
      The requested page or route could not be found or has been moved.
    </p>

    <!-- Action Button -->
    <div class="mt-8 flex flex-col sm:flex-row items-center justify-center gap-3">
      <a href="/dashboard" class="w-full inline-flex items-center justify-center gap-x-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 px-5 py-3 text-sm font-semibold text-white transition-all shadow-lg shadow-indigo-600/25 active:scale-95">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
        </svg>
        Go to Dashboard
      </a>
    </div>

  </div>
</body>
</html>
