<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Sastrybalm SFA</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full">
<div class="min-h-full flex flex-col justify-center py-12 sm:px-6 lg:px-8 bg-slate-950">

  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="flex justify-center">
      <div class="h-14 w-14 bg-indigo-600 rounded-2xl flex items-center justify-center shadow-lg">
        <span class="text-white font-bold text-2xl">S</span>
      </div>
    </div>
    <h2 class="mt-6 text-center text-3xl font-bold tracking-tight text-white">Sastrybalm SFA</h2>
    <p class="mt-2 text-center text-sm text-slate-400">Field Sales Force Automation</p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-slate-900 border border-slate-700 py-8 px-4 shadow-xl rounded-2xl sm:px-10">

      {% if error %}
      <div class="mb-4 rounded-lg bg-red-900/40 border border-red-700 p-4">
        <div class="flex items-center gap-x-2">
          <svg class="h-5 w-5 text-red-400 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16ZM8.28 7.22a.75.75 0 0 0-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 1 0 1.06 1.06L10 11.06l1.72 1.72a.75.75 0 1 0 1.06-1.06L11.06 10l1.72-1.72a.75.75 0 0 0-1.06-1.06L10 8.94 8.28 7.22Z" clip-rule="evenodd" />
          </svg>
          <p class="text-sm font-medium text-red-300">{{ error }}</p>
        </div>
      </div>
      {% endif %}

      <form action="/login" method="post" class="space-y-5">
        <div>
          <label for="username" class="block text-sm font-medium text-slate-300">Username or Email</label>
          <div class="mt-1.5">
            <input id="username" name="username" type="text" required autocomplete="username"
              class="block w-full rounded-lg border border-slate-600 bg-slate-800 px-4 py-2.5 text-white placeholder-slate-500 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 sm:text-sm"
              placeholder="Enter username or email" />
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-slate-300">Password</label>
          <div class="mt-1.5">
            <input id="password" name="password" type="password" required autocomplete="current-password"
              class="block w-full rounded-lg border border-slate-600 bg-slate-800 px-4 py-2.5 text-white placeholder-slate-500 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 sm:text-sm"
              placeholder="Enter password" />
          </div>
        </div>

        <div>
          <button type="submit"
            class="flex w-full justify-center rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 transition-colors duration-150">
            Sign in
          </button>
        </div>
      </form>
    </div>

    <p class="mt-6 text-center text-xs text-slate-600">
      Sastrybalm SFA &copy; 2026 &mdash; Internal use only
    </p>
  </div>
</div>
</body>
</html>
