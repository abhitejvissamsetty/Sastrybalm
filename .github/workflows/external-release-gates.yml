name: External release gates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-s3:
    runs-on: ubuntu-latest
    env:
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      S3_TEMP_ACCESS_KEY: ${{ secrets.S3_TEMP_ACCESS_KEY }}
      S3_TEMP_SECRET_KEY: ${{ secrets.S3_TEMP_SECRET_KEY }}
      S3_TEMP_SESSION_TOKEN: ${{ secrets.S3_TEMP_SESSION_TOKEN }}
      S3_DENIED_ACCESS_KEY: ${{ secrets.S3_DENIED_ACCESS_KEY }}
      S3_DENIED_SECRET_KEY: ${{ secrets.S3_DENIED_SECRET_KEY }}
      S3_DENIED_SESSION_TOKEN: ${{ secrets.S3_DENIED_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install production dependencies
        run: pip install -r requirements.lock

      - name: Verify live S3 policy and workflows
        run: python scripts/verify_live_s3.py | tee live-s3-report.json

      - name: Upload S3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: live-s3-release-evidence
          path: live-s3-report.json
          if-no-files-found: error

  signed-external-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require completed release evidence
        run: test -f docs/release-evidence.json

      - name: Verify rotations, telemetry, CI, UAT, and independent review
        run: python scripts/verify_external_release_evidence.py docs/release-evidence.json

      - name: Upload signed release evidence
        uses: actions/upload-artifact@v4
        with:
          name: signed-external-release-evidence
          path: docs/release-evidence.json
          if-no-files-found: error
