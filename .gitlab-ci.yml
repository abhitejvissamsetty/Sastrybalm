# Security & Analysis Templates
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

image: docker:29.2.1

variables:
  DOCKER_BUILDKIT: "1"
  DOCKER_HOST: "tcp://docker:2375" # GitLab SaaS DinD
  DOCKER_TLS_CERTDIR: ""           # Disabling TLS for SaaS DinD
  SECRET_DETECTION_ENABLED: 'true'

stages:
  - test
  - build
  - deploy

# ── 1. TEST STAGE ─────────────────────────────────────────────────────────────

secret_detection:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "staging"

unit_tests:
  stage: test
  image: python:3.12-slim
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev
    - pip install --no-cache-dir -r requirements.txt
  script:
    - python -m pytest -o addopts=""

# ── 2. BUILD STAGE ────────────────────────────────────────────────────────────

.build_template: &build_definition
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "staging"
  services:
    - docker:29.2-dind
  before_script:
    - apk add --no-cache git bash gettext
    - docker buildx create --name ci-builder --use --driver docker-container --driver-opt network=host
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  after_script:
    - docker buildx rm ci-builder || true
    - docker builder prune --filter "until=24h" -f
  script:
    # Setup Image Tags
    - export TAG="${CI_COMMIT_REF_SLUG}"
    - export APP_IMAGE="$CI_REGISTRY_IMAGE/$IMAGE_NAME:$TAG"
    - export NGINX_IMAGE="$CI_REGISTRY_IMAGE/${IMAGE_NAME}-nginx:$TAG"

    # Build & Push FastAPI Backend Image (sastrybalm-app)
    - |
      docker buildx build \
        --platform linux/amd64 \
        --push \
        --no-cache \
        --provenance=false \
        --sbom=false \
        --tag $APP_IMAGE \
        --file Dockerfile .

    # Build & Push Nginx Reverse Proxy Image
    - |
      cat <<EOF > Nginx.Containerfile
      FROM nginx:1.27-alpine
      COPY nginx/default.conf /etc/nginx/conf.d/default.conf
      EOF
      docker buildx build \
        --platform linux/amd64 \
        --push \
        --no-cache \
        --provenance=false \
        --sbom=false \
        --tag $NGINX_IMAGE \
        --file Nginx.Containerfile .

build_production:
  <<: *build_definition
  variables:
    IMAGE_NAME: "safar-app"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build_staging:
  <<: *build_definition
  variables:
    IMAGE_NAME: "safar-app-staging"
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"

# ── 3. DEPLOY STAGE ───────────────────────────────────────────────────────────

.deploy_template: &deploy_definition
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client bash
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config

deploy_staging:
  <<: *deploy_definition
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
  script:
    - |
      ssh $SERVER_USER@$STAGING_SERVER_IP "
        cd /opt/sastrybalm && \
        echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin $CI_REGISTRY && \
        docker compose pull && \
        docker compose up -d --remove-orphans
      "

deploy_production:
  <<: *deploy_definition
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  script:
    - |
      ssh $SERVER_USER@$PRODUCTION_SERVER_IP "
        cd /opt/sastrybalm && \
        echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin $CI_REGISTRY && \
        docker compose pull && \
        docker compose up -d --remove-orphans
      "
