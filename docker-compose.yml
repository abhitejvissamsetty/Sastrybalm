services:
  # ── MySQL Database ──────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: safar-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-safar_db}
      MYSQL_USER: ${DB_USER:-safar_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-safar_password}
    ports:
      - "3308:3306"     # host:3308 → container:3306 to avoid conflicts with Docker Desktop
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - safar-net

  # ── Web DB Manager (Adminer) ────────────────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: safar-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    networks:
      - safar-net

  # ── FastAPI Application ─────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safar-app
    restart: unless-stopped
    expose:
      - "8090"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APP_NAME=${APP_NAME:-Safar SFA}
      - SECRET_KEY=${SECRET_KEY:-change-this-to-a-long-random-string-in-production}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-safar_user}
      - DB_PASSWORD=${DB_PASSWORD:-safar_password}
      - DB_NAME=${DB_NAME:-safar_db}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-10080}
      - CMMS_BASE_URL=${CMMS_BASE_URL:-}
      - CMMS_API_KEY=${CMMS_API_KEY:-}
      - CONNECT_BASE_URL=${CONNECT_BASE_URL:-}
      - CONNECT_API_KEY=${CONNECT_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@safar.com}
    volumes:
      - ./app:/app/app
      - ./db_migrate.py:/app/db_migrate.py
      - uploads_data:/app/app/static/uploads
    networks:
      - safar-net

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: safar-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro        # mount SSL certs here
    depends_on:
      - app
    networks:
      - safar-net

volumes:
  mysql_data:
  uploads_data:

networks:
  safar-net:
    driver: bridge
