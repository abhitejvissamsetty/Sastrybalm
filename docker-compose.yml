services:
  # ── MySQL Database ──────────────────────────────────────────────────────────
  db:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    container_name: safar-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-safar_db}
      MYSQL_USER: ${DB_USER:-safar_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:3308:3306"     # local diagnostics only; never exposed publicly
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - safar-net

  # ── Web DB Manager (Adminer) ────────────────────────────────────────────────
  adminer:
    image: adminer:4.8.1@sha256:34d37131366c5aa84e1693dbed48593ed6f95fb450b576c1a7a59d3a9c9e8802
    container_name: safar-adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - safar-net

  # ── FastAPI Application ─────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safar-app
    restart: unless-stopped
    expose:
      - "8090"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APP_NAME=${APP_NAME:-Safar SFA}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
      - ENABLE_API_DOCS=${ENABLE_API_DOCS:-true}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-safar_user}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - DB_NAME=${DB_NAME:-safar_db}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@safar.com}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-10080}
      - METRICS_TOKEN=${METRICS_TOKEN:-local-metrics-token-32-characters-minimum}
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini:ro
      - ./scripts:/app/scripts:ro
      - ./performance:/app/performance
      - uploads_data:/app/app/static/uploads
      - backup_data:/app/var/backups
    ports:
      - "127.0.0.1:8090:8090"
    networks:
      - safar-net

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safar-scheduler
    restart: unless-stopped
    command: ["scheduler"]
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-safar_user}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - DB_NAME=${DB_NAME:-safar_db}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@safar.com}
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      - METRICS_TOKEN=${METRICS_TOKEN:-local-metrics-token-32-characters-minimum}
    volumes:
      - ./app:/app/app
      - uploads_data:/app/app/static/uploads
      - backup_data:/app/var/backups
    networks:
      - safar-net

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: safar-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro        # mount SSL certs here
    depends_on:
      - app
    networks:
      - safar-net

volumes:
  mysql_data:
  uploads_data:
  backup_data:

networks:
  safar-net:
    driver: bridge
