upstream sastrybalm_backend {
    server app:8090;
}

server {
    listen 80;
    server_name _;

    # Redirect all HTTP → HTTPS (uncomment when SSL certs are in place)
    # return 301 https://$host$request_uri;

    client_max_body_size 20M;

    # ── Static files served directly by Nginx ─────────────────────────────────
    # Note: For this to work without a shared volume, static files are served
    # through the app. If you want Nginx-direct serving, mount a shared volume
    # for app/static in both the app and nginx containers.

    # ── Reverse proxy to FastAPI ──────────────────────────────────────────────
    location / {
        proxy_pass         http://sastrybalm_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}

