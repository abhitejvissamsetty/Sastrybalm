name: sfa_mobile
description: Safar Mobile App for Field Sales Representatives
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # HTTP
  dio: ^5.4.3+1

  # Secure Storage (JWT)
  flutter_secure_storage: ^9.0.0

  # Local DB (offline cache)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # GPS
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  permission_handler: ^11.3.0

  # Image upload
  image_picker: ^1.1.0

  # Navigation
  go_router: ^13.2.1

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  # Utilities
  intl: ^0.19.0
  connectivity_plus: ^6.0.3
  path_provider: ^2.1.3
  uuid: ^4.4.0
  shared_preferences: ^2.3.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
