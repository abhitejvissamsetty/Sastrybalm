services:
  db:
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a rotated MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME}
      MYSQL_USER: ${DB_USER:?Set a least-privilege DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set a rotated DB_PASSWORD}
    ports: !reset []

  adminer:
    profiles: ["diagnostics"]
    ports: !reset []
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    security_opt:
      - no-new-privileges:true

  app:
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?Set a unique SECRET_KEY of at least 32 characters}
      DB_USER: ${DB_USER:?Set a least-privilege DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set a rotated DB_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a rotated ADMIN_PASSWORD}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?Set an independent BACKUP_ENCRYPTION_KEY}
      SMTP_HOST: ${SMTP_HOST:?Set the SMTP server hostname}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set a rotated SMTP password}
      SMTP_FROM: ${SMTP_FROM:?Set the SMTP sender address}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set explicit HTTPS CORS origins}
      SENTRY_DSN: ${SENTRY_DSN:?Set the centralized error-reporting DSN}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      METRICS_TOKEN: ${METRICS_TOKEN:?Set a unique metrics scrape token}
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
      PARQUET_BACKUP_RETENTION_DAYS: ${PARQUET_BACKUP_RETENTION_DAYS:-2555}
      SECURE_COOKIES: "true"
      ENABLE_API_DOCS: "false"
    ports: !reset []
    volumes: !override
      - uploads_data:/app/app/static/uploads
      - backup_data:/app/var/backups

  scheduler:
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?Set a unique SECRET_KEY of at least 32 characters}
      DB_USER: ${DB_USER:?Set a least-privilege DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set a rotated DB_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a rotated ADMIN_PASSWORD}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?Set an independent BACKUP_ENCRYPTION_KEY}
      SMTP_HOST: ${SMTP_HOST:?Set the SMTP server hostname}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set a rotated SMTP password}
      SMTP_FROM: ${SMTP_FROM:?Set the SMTP sender address}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set explicit HTTPS CORS origins}
      SENTRY_DSN: ${SENTRY_DSN:?Set the centralized error-reporting DSN}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      METRICS_TOKEN: ${METRICS_TOKEN:?Set a unique metrics scrape token}
      SECURE_COOKIES: "true"
      ENABLE_API_DOCS: "false"
    volumes: !override
      - uploads_data:/app/app/static/uploads
      - backup_data:/app/var/backups

  nginx:
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    ports: !override
      - "80:80"
      - "443:443"
    volumes: !override
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:?Set TLS_CERT_DIR to the directory containing fullchain.pem and privkey.pem}:/etc/nginx/certs:ro
